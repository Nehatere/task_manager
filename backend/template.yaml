AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Task Manager 3-tier app
  Lambda + API Gateway + DynamoDB

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref TasksTable
        USERS_TABLE_NAME: !Ref UsersTable
        SESSIONS_TABLE_NAME: !Ref SessionsTable

Resources:

  # ---------- DynamoDB ----------
  TasksTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: tasks-table
      PrimaryKey:
        Name: taskId
        Type: String

  UsersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: users-table
      PrimaryKey:
        Name: username
        Type: String

  SessionsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: sessions-table
      PrimaryKey:
        Name: tokenHash
        Type: String

  # ---------- API Gateway ----------
  TasksApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ---------- Existing task functions ----------
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: POST

  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getTasks.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: GET

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: PUT

  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: DELETE

  # ---------- Authentication ----------
  BootstrapAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bootstrapAdmin.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /auth/bootstrap-admin
            Method: POST

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: login.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /auth/login
            Method: POST

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: logout.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /auth/logout
            Method: POST

  # ---------- Team management ----------
  CreateTeamMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createTeamMember.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /team-members
            Method: POST

  GetTeamMembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getTeamMembers.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /team-members
            Method: GET

  DeleteTeamMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteTeamMember.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /team-members/{username}
            Method: DELETE

  # ---------- Employee tasks ----------
  GetMyTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getMyTasks.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TasksTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /employee/tasks
            Method: GET

  UpdateMyTaskStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateMyTaskStatus.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /employee/tasks/{taskId}/status
            Method: PUT

Outputs:
  ApiUrl:
    Description: "Base URL for Task Manager API"
    Value: !Sub "https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  TasksApiUrl:
    Value: !Sub "https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/prod/tasks"

  UsersTableName:
    Value: !Ref UsersTable

  SessionsTableName:
    Value: !Ref SessionsTable

  TasksTableName:
    Value: !Ref TasksTable
