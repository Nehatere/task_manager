AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Task Manager 3-tier app - backend (Lambda + API Gateway + DynamoDB)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref TasksTable

Resources:

  # ---------- DynamoDB ----------
  # Single-table design. Partition key: taskId (a UUID we generate per task).
  # We don't need a sort key since each item IS a task (no hierarchical data).
  # On-demand billing so we stay in the free tier regardless of traffic pattern.
  TasksTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: tasks-table
      PrimaryKey:
        Name: taskId
        Type: String
      

  # ---------- API Gateway ----------
  TasksApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # ---------- Lambda functions ----------
  # Each function gets exactly the IAM permissions it needs (least privilege),
  # granted via SAM's Policies shorthand (DynamoDBCrudPolicy) rather than a
  # broad admin role. This is what lets Lambda actually talk to DynamoDB.

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: POST

  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getTasks.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks
            Method: GET

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: updateTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: PUT

  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: deleteTask.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TasksApi
            Path: /tasks/{taskId}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: "Base URL for the Task Manager API"
    Value: !Sub "https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/prod/tasks"
  TableName:
    Value: !Ref TasksTable
