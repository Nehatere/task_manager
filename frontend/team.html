<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Team - Task Manager</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/team.css">
</head>

<body>

  <main class="container">

    <div class="page-header">
      <a href="/" class="back-btn">← Back to Tasks</a>
      <h1>Manage Team</h1>
    </div>

    <section class="team-card">

      <h2>Add Employee</h2>

      <p class="team-help">
        Create a login account for an employee.
      </p>

      <form id="member-form" class="member-form">

        <input
          type="text"
          id="member-name"
          placeholder="Full name"
          required
        >

        <input
          type="text"
          id="member-username"
          placeholder="Username"
          autocomplete="off"
          required
        >

        <input
          type="email"
          id="member-email"
          placeholder="Email address"
        >

        <input
          type="password"
          id="member-password"
          placeholder="Password (minimum 8 characters)"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit" id="create-member-button">
          Create Employee
        </button>

      </form>

      <p id="member-message" class="member-message"></p>

    </section>

    <section class="team-card">

      <div class="team-section-header">
        <h2>Employees</h2>
        <span id="member-count" class="member-count">
          0 Members
        </span>
      </div>

      <div id="member-list" class="member-list">

        <p class="empty-members">
          Loading employees...
        </p>

      </div>

    </section>

  </main>

  <script src="/config.js"></script>
  <script src="/team.js"></script>

</body>
</html>
