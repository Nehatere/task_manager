<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Team - Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="team.css">
</head>

<body>
  <main class="container">

    <div class="page-header">
      <a href="./" class="back-btn">← Back to Tasks</a>
      <h1>Manage Team</h1>
    </div>

    <section class="team-card">
      <h2>Add Team Member</h2>

      <p class="team-help">
        Create an account for a team member who can log in and view assigned tasks.
      </p>

      <form id="member-form" class="member-form">
        <input
          type="text"
          id="member-name"
          placeholder="Full name"
          required
        >

        <input
          type="email"
          id="member-email"
          placeholder="Email address"
          required
        >

        <button type="submit">
          Create Team Member
        </button>
      </form>

      <p id="member-message" class="member-message"></p>
    </section>

    <section class="team-card">

      <div class="team-section-header">
        <h2>Team Members</h2>
        <span id="member-count" class="member-count">0 Members</span>
      </div>

      <div id="member-list" class="member-list">
        <p class="empty-members">
          No team members yet.
        </p>
      </div>

    </section>

  </main>
</body>
</html>
