<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">

    <h1>Task Manager</h1>

    <div class="admin-actions">
      <a href="team-management/" class="manage-team-btn">
      Manage Team
      </a>
    </div>

    <section class="summary" id="summary">

      <div class="summary-item">
        <span class="summary-count" id="total-count">0</span>
        <span class="summary-label">Total</span>
      </div>

      <div class="summary-item todo">
        <span class="summary-count" id="todo-count">0</span>
        <span class="summary-label">To Do</span>
      </div>

      <div class="summary-item progress">
        <span class="summary-count" id="progress-count">0</span>
        <span class="summary-label">In Progress</span>
      </div>

      <div class="summary-item completed">
        <span class="summary-count" id="completed-count">0</span>
        <span class="summary-label">Completed</span>
      </div>

    </section>

    <form id="task-form" class="task-form">

      <input
        type="text"
        id="title"
        placeholder="Task title"
        required
      />

      <textarea
        id="description"
        placeholder="Description (optional)"
      ></textarea>

      <select id="priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>

      <input
        type="text"
        id="assignedTo"
        placeholder="Assigned to"
      />

      <button type="submit">Add Task</button>

    </form>

    <p id="error-message" class="error-message"></p>

    <ul id="task-list" class="task-list"></ul>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
